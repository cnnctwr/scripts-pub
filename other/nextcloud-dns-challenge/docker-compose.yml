services:
  traefik:
    image: traefik:v3
    network_mode: host        # damit 127.0.0.1:11000 erreichbar ist
    restart: unless-stopped
    environment:
      - DESEC_TOKEN=<deSEC-Token>
    command:
      - --entrypoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/nextcloud.yml
      - --certificatesresolvers.desec.acme.email=<admin-adresse>
      - --certificatesresolvers.desec.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.desec.acme.dnschallenge.provider=desec
    volumes:
      - ./nextcloud.yml:/etc/traefik/nextcloud.yml:ro
      - ./letsencrypt:/letsencrypt
